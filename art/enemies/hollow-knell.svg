<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Hollow Knell</title>
  <!-- Palette: cartographer-primary #d8a446 / secondary #6e4a28 / deep #2a1d10 (tarnished bronze), ui-bg-3 #262e3f + ui-line #36405a (shroud), tidecaller-accent #a6f2e8 (ghost light), ui-rim #8fa3c7, outline #05070b -->
  <defs>
    <filter id="rim" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown"/>
      <feFlood flood-color="#8fa3c7" flood-opacity="0.6"/>
      <feComposite in2="grown" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#d8a446"/>
      <stop offset="0.45" stop-color="#6e4a28"/>
      <stop offset="1" stop-color="#2a1d10"/>
    </linearGradient>
    <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36405a"/>
      <stop offset="1" stop-color="#262e3f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="244" rx="60" ry="7" fill="#05070b" opacity="0.5"/>
  <!-- tolling rings -->
  <g fill="none" stroke="#a6f2e8" stroke-linecap="round" opacity="0.55">
    <path d="M40 80 a60 60 0 0 0 0 80 M24 66 a80 80 0 0 0 0 108" stroke-width="3"/>
    <path d="M216 80 a60 60 0 0 1 0 80 M232 66 a80 80 0 0 1 0 108" stroke-width="3"/>
  </g>
  <g filter="url(#rim)" stroke="#05070b" stroke-linejoin="round" stroke-linecap="round">
    <!-- tattered shroud -->
    <path d="M58 172 L 62 232 L 78 208 L 90 246 L 104 212 L 116 240 L 128 214 L 140 242 L 152 212 L 166 246 L 178 208 L 194 232 L 198 172 Z" fill="url(#shroud)" stroke-width="3"/>
    <path d="M84 186 L 90 226 M128 190 V206 M172 186 L 166 226" fill="none" stroke="#262e3f" stroke-width="2"/>
    <!-- broken chain + crown loop -->
    <path d="M128 6 V16" stroke-width="4"/>
    <rect x="122" y="12" width="12" height="16" rx="6" fill="none" stroke="#6e4a28" stroke-width="4"/>
    <circle cx="128" cy="34" r="9" fill="none" stroke-width="8"/>
    <circle cx="128" cy="34" r="9" fill="none" stroke="#d8a446" stroke-width="4"/>
    <!-- bell -->
    <path d="M128 40 C 96 40 84 64 82 102 C 80 140 70 160 50 176 L 206 176 C 186 160 176 140 174 102 C 172 64 160 40 128 40 Z" fill="url(#bronze)" stroke-width="4"/>
    <path d="M96 66 C 90 84 90 110 88 136" fill="none" stroke="#d8a446" stroke-width="3"/>
    <path d="M86 132 H170 M84 142 H172" fill="none" stroke="#2a1d10" stroke-width="2"/>
    <!-- crack -->
    <path d="M150 48 L 142 70 L 152 82 L 140 100 L 148 112" fill="none" stroke-width="3"/>
    <!-- lip and hollow mouth -->
    <ellipse cx="128" cy="176" rx="80" ry="13" fill="#6e4a28" stroke-width="4"/>
    <ellipse cx="128" cy="177" rx="68" ry="8" fill="#05070b" stroke="none"/>
    <!-- carved eye holes -->
    <path d="M100 100 Q 110 88 120 100 Q 110 108 100 100 Z M136 100 Q 146 88 156 100 Q 146 108 136 100 Z" fill="#05070b" stroke-width="2"/>
    <!-- clapper -->
    <path d="M128 180 V194" stroke-width="5"/>
    <circle cx="128" cy="204" r="13" fill="#a6f2e8" stroke-width="4"/>
  </g>
  <!-- ghost light -->
  <g fill="#a6f2e8">
    <circle cx="128" cy="204" r="16" filter="url(#glow)" opacity="0.6"/>
    <ellipse cx="110" cy="99" rx="7" ry="4" filter="url(#glow)"/>
    <ellipse cx="146" cy="99" rx="7" ry="4" filter="url(#glow)"/>
    <ellipse cx="110" cy="99" rx="5" ry="3"/>
    <ellipse cx="146" cy="99" rx="5" ry="3"/>
  </g>
  <circle cx="123" cy="199" r="3.5" fill="#eef1f6"/>
</svg>
