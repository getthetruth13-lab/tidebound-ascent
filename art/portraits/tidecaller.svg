<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Tidecaller portrait</title>
  <!-- Palette: tidecaller primary #2fb8c4, secondary #155a80, accent #a6f2e8, deep #0a2a3d; outline #05070b -->
  <defs>
    <radialGradient id="tc-bg" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#155a80"/>
      <stop offset="1" stop-color="#0a2a3d"/>
    </radialGradient>
    <linearGradient id="tc-cloak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fb8c4"/>
      <stop offset="0.3" stop-color="#155a80"/>
      <stop offset="1" stop-color="#0a2a3d"/>
    </linearGradient>
    <radialGradient id="tc-face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#0a2a3d"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <filter id="tc-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="tc-clip"><rect x="4" y="4" width="248" height="248" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#tc-clip)">
    <rect width="256" height="256" fill="url(#tc-bg)"/>
    <!-- moon that pulls the tide -->
    <circle cx="190" cy="62" r="22" fill="#a6f2e8" opacity="0.9"/>
    <circle cx="200" cy="55" r="20" fill="#155a80"/>
    <!-- background swells -->
    <path d="M0 168 q32 -22 64 0 t64 0 t64 0 t64 0 V256 H0 Z" fill="#155a80" opacity="0.7"/>
    <path d="M0 196 q32 -20 64 0 t64 0 t64 0 t64 0 V256 H0 Z" fill="#2fb8c4" opacity="0.35"/>
    <path d="M0 168 q32 -22 64 0 t64 0 t64 0 t64 0" fill="none" stroke="#a6f2e8" stroke-width="2" opacity="0.5"/>

    <!-- hood + cloak silhouette -->
    <path d="M128 40 C 84 40 62 82 64 126 C 66 154 58 176 42 198 L 28 260 L 228 260 L 214 198 C 198 176 190 154 192 126 C 194 82 172 40 128 40 Z"
          fill="url(#tc-cloak)" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <!-- rim light (key from top-left) -->
    <path d="M80 82 C 70 100 68 116 69 132" fill="none" stroke="#2fb8c4" stroke-width="3" stroke-linecap="round"/>
    <!-- hood crest curling like a wave -->
    <path d="M128 40 C 150 40 170 52 180 72 C 168 64 150 64 142 76 C 136 66 132 52 128 40 Z" fill="#2fb8c4" stroke="#05070b" stroke-width="2" stroke-linejoin="round"/>

    <!-- face opening in shadow -->
    <path d="M128 78 C 102 78 90 104 92 130 C 94 154 108 170 128 172 C 148 170 162 154 164 130 C 166 104 154 78 128 78 Z"
          fill="url(#tc-face)" stroke="#2fb8c4" stroke-width="4"/>
    <!-- glowing eyes -->
    <g fill="#a6f2e8">
      <ellipse cx="113" cy="128" rx="8" ry="4" filter="url(#tc-glow)" opacity="0.9"/>
      <ellipse cx="143" cy="128" rx="8" ry="4" filter="url(#tc-glow)" opacity="0.9"/>
      <path d="M105 128 Q113 121 121 128 Q113 132 105 128 Z"/>
      <path d="M135 128 Q143 121 151 128 Q143 132 135 128 Z"/>
    </g>

    <!-- wave-crest mantle -->
    <path d="M40 210 q22 -24 44 0 q22 -24 44 0 q22 -24 44 0 q22 -24 44 0 L 228 260 L 28 260 Z"
          fill="#2fb8c4" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M48 204 q14 -12 28 -2 M92 204 q14 -12 28 -2 M136 204 q14 -12 28 -2 M180 204 q14 -12 28 -2"
          fill="none" stroke="#a6f2e8" stroke-width="3" stroke-linecap="round"/>
    <path d="M40 236 q22 -14 44 0 t44 0 t44 0 t44 0" fill="none" stroke="#155a80" stroke-width="2"/>

    <!-- shell clasp -->
    <path d="M128 200 L 112 222 Q 128 234 144 222 Z" fill="#a6f2e8" stroke="#05070b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M128 202 V228 M128 202 L120 226 M128 202 L136 226" stroke="#155a80" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="4" y="4" width="248" height="248" rx="22" fill="none" stroke="#2fb8c4" stroke-width="4"/>
  <rect x="10" y="10" width="236" height="236" rx="17" fill="none" stroke="#05070b" stroke-width="2" opacity="0.6"/>
</svg>
