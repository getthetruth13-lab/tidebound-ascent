<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Cartographer portrait</title>
  <!-- Palette: cartographer primary #d8a446, secondary #6e4a28, accent #f3e3bf, deep #2a1d10; ui-ink #1a2230; outline #05070b -->
  <defs>
    <radialGradient id="ca-bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#6e4a28"/>
      <stop offset="1" stop-color="#2a1d10"/>
    </radialGradient>
    <linearGradient id="ca-coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8a446" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#6e4a28"/>
      <stop offset="1" stop-color="#2a1d10"/>
    </linearGradient>
    <filter id="ca-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="ca-clip"><rect x="4" y="4" width="248" height="248" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#ca-clip)">
    <rect width="256" height="256" fill="url(#ca-bg)"/>
    <!-- faint graticule -->
    <g stroke="#f3e3bf" stroke-width="1" opacity="0.12">
      <path d="M0 48 H256 M0 96 H256 M0 144 H256 M0 192 H256 M48 0 V256 M96 0 V256 M160 0 V256 M208 0 V256"/>
    </g>
    <!-- compass rose behind -->
    <g transform="translate(128 118)" opacity="0.45">
      <circle r="96" fill="none" stroke="#d8a446" stroke-width="2" stroke-dasharray="3 6"/>
      <circle r="80" fill="none" stroke="#d8a446" stroke-width="1.5"/>
      <path d="M0 -112 L10 -10 L0 0 Z M0 112 L-10 10 L0 0 Z M-112 0 L-10 -10 L0 0 Z M112 0 L10 10 L0 0 Z" fill="#d8a446"/>
      <path d="M0 -112 L-10 -10 L0 0 Z M0 112 L10 10 L0 0 Z M-112 0 L-10 10 L0 0 Z M112 0 L10 -10 L0 0 Z" fill="#f3e3bf"/>
      <path d="M62 -62 L6 -6 L0 0 Z M-62 62 L-6 6 Z M-62 -62 L-6 -6 Z M62 62 L6 6 Z" fill="none" stroke="#d8a446" stroke-width="3"/>
    </g>

    <!-- coat -->
    <path d="M36 260 L 52 196 C 60 176 84 166 106 164 L 150 164 C 172 166 196 176 204 196 L 220 260 Z"
          fill="url(#ca-coat)" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <!-- scarf -->
    <path d="M100 162 C 112 176 144 176 156 162 L 160 176 C 144 192 112 192 96 176 Z" fill="#1a2230" stroke="#05070b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M140 182 L 150 214 L 136 210 Z" fill="#1a2230" stroke="#05070b" stroke-width="3" stroke-linejoin="round"/>
    <!-- lapels -->
    <path d="M96 178 L 116 230 M160 178 L 140 230" stroke="#d8a446" stroke-width="3" stroke-linecap="round"/>

    <!-- face in hat shadow -->
    <path d="M96 104 C 96 138 108 160 128 162 C 148 160 160 138 160 104 Z" fill="#2a1d10" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <!-- spectacles -->
    <g>
      <circle cx="114" cy="124" r="10" fill="#f3e3bf" filter="url(#ca-glow)" opacity="0.7"/>
      <circle cx="142" cy="124" r="10" fill="#f3e3bf" filter="url(#ca-glow)" opacity="0.7"/>
      <circle cx="114" cy="124" r="9" fill="#f3e3bf" stroke="#d8a446" stroke-width="3"/>
      <circle cx="142" cy="124" r="9" fill="#f3e3bf" stroke="#d8a446" stroke-width="3"/>
      <path d="M123 124 Q128 119 133 124" fill="none" stroke="#d8a446" stroke-width="3"/>
      <path d="M109 120 l5 -4 M137 120 l5 -4" stroke="#eef1f6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- wide-brim hat -->
    <path d="M84 98 C 82 62 100 44 128 44 C 156 44 174 62 172 98 Z" fill="#1a2230" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M84 84 C 110 90 146 90 172 84 L 172 96 C 146 102 110 102 84 96 Z" fill="#d8a446" stroke="#05070b" stroke-width="2"/>
    <path d="M30 104 C 58 88 198 88 226 104 C 214 116 42 116 30 104 Z" fill="#1a2230" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M44 100 C 80 92 120 90 150 92" fill="none" stroke="#6e4a28" stroke-width="2" stroke-linecap="round"/>
    <!-- quill tucked in hat band -->
    <path d="M160 92 C 170 60 192 34 224 16 C 212 44 194 68 168 94 Z" fill="#f3e3bf" stroke="#05070b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M164 92 C 182 66 200 44 222 18" fill="none" stroke="#6e4a28" stroke-width="2" stroke-linecap="round"/>
    <path d="M182 60 l10 2 M190 50 l10 2 M176 70 l-8 -4" stroke="#6e4a28" stroke-width="1.5" stroke-linecap="round"/>

    <!-- map scroll -->
    <path d="M58 216 H198 V252 H58 Z" fill="#f3e3bf" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 244 C 90 226 104 246 122 232 S 150 226 166 236" fill="none" stroke="#1a2230" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>
    <path d="M172 230 l10 10 M182 230 l-10 10" stroke="#ec5f4a" stroke-width="3" stroke-linecap="round"/>
    <rect x="48" y="210" width="14" height="48" rx="7" fill="#d8a446" stroke="#05070b" stroke-width="3"/>
    <rect x="194" y="210" width="14" height="48" rx="7" fill="#d8a446" stroke="#05070b" stroke-width="3"/>
  </g>
  <rect x="4" y="4" width="248" height="248" rx="22" fill="none" stroke="#d8a446" stroke-width="4"/>
  <rect x="10" y="10" width="236" height="236" rx="17" fill="none" stroke="#05070b" stroke-width="2" opacity="0.6"/>
</svg>
