<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" role="img" aria-labelledby="t">
  <title id="t">Cartographer card frame</title>
  <!-- Regions: gem c(32,32) r22 | banner x52-234 y16-48 | art window x20-230 y58-194 (transparent) | type x60-190 y194-214 | text x18-232 y220-326 | rarity c(125,336) r8 -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6e4a28"/>
      <stop offset="0.55" stop-color="#2a1d10"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#6e4a28"/>
      <stop offset="1" stop-color="#2a1d10"/>
    </radialGradient>
  </defs>

  <!-- frame body with transparent art window -->
  <path d="M18 4 H232 A14 14 0 0 1 246 18 V332 A14 14 0 0 1 232 346 H18 A14 14 0 0 1 4 332 V18 A14 14 0 0 1 18 4 Z M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="url(#body)" fill-rule="evenodd" stroke="#05070b" stroke-width="2"/>
  <path d="M18 4 H232 A14 14 0 0 1 246 18 V332 A14 14 0 0 1 232 346 H18 A14 14 0 0 1 4 332 V18 A14 14 0 0 1 18 4 Z" fill="none" stroke="#d8a446" stroke-width="3" transform="translate(125 175) scale(0.985) translate(-125 -175)"/>
  <path d="M19 9 H231 A10 10 0 0 1 241 19 V331 A10 10 0 0 1 231 341 H19 A10 10 0 0 1 9 331 V19 A10 10 0 0 1 19 9 Z" fill="none" stroke="#f3e3bf" stroke-width="1" opacity="0.35"/>
  <!-- art window rim -->
  <path d="M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="none" stroke="#05070b" stroke-width="4"/>
  <path d="M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="none" stroke="#d8a446" stroke-width="2"/>

  <!-- text box (dark panel, keep clear of decoration) -->
  <rect x="18" y="220" width="214" height="106" rx="8" fill="#0b0e14" fill-opacity="0.92" stroke="#36405a" stroke-width="1.5"/>
  
  <!-- motif: map neatline (alternating segments), compass star behind rarity socket, dashed route + tick marks -->
  <g stroke-width="4"><line x1="12" y1="62" x2="12" y2="78" stroke="#f3e3bf"/><line x1="238" y1="62" x2="238" y2="78" stroke="#f3e3bf"/><line x1="12" y1="78" x2="12" y2="94" stroke="#05070b"/><line x1="238" y1="78" x2="238" y2="94" stroke="#05070b"/><line x1="12" y1="94" x2="12" y2="110" stroke="#f3e3bf"/><line x1="238" y1="94" x2="238" y2="110" stroke="#f3e3bf"/><line x1="12" y1="110" x2="12" y2="126" stroke="#05070b"/><line x1="238" y1="110" x2="238" y2="126" stroke="#05070b"/><line x1="12" y1="126" x2="12" y2="142" stroke="#f3e3bf"/><line x1="238" y1="126" x2="238" y2="142" stroke="#f3e3bf"/><line x1="12" y1="142" x2="12" y2="158" stroke="#05070b"/><line x1="238" y1="142" x2="238" y2="158" stroke="#05070b"/><line x1="12" y1="158" x2="12" y2="174" stroke="#f3e3bf"/><line x1="238" y1="158" x2="238" y2="174" stroke="#f3e3bf"/><line x1="12" y1="174" x2="12" y2="190" stroke="#05070b"/><line x1="238" y1="174" x2="238" y2="190" stroke="#05070b"/><line x1="10" y1="222" x2="10" y2="238" stroke="#f3e3bf"/><line x1="240" y1="222" x2="240" y2="238" stroke="#f3e3bf"/><line x1="10" y1="238" x2="10" y2="254" stroke="#05070b"/><line x1="240" y1="238" x2="240" y2="254" stroke="#05070b"/><line x1="10" y1="254" x2="10" y2="270" stroke="#f3e3bf"/><line x1="240" y1="254" x2="240" y2="270" stroke="#f3e3bf"/><line x1="10" y1="270" x2="10" y2="286" stroke="#05070b"/><line x1="240" y1="270" x2="240" y2="286" stroke="#05070b"/><line x1="10" y1="286" x2="10" y2="302" stroke="#f3e3bf"/><line x1="240" y1="286" x2="240" y2="302" stroke="#f3e3bf"/><line x1="10" y1="302" x2="10" y2="318" stroke="#05070b"/><line x1="240" y1="302" x2="240" y2="318" stroke="#05070b"/><line x1="10" y1="318" x2="10" y2="326" stroke="#f3e3bf"/><line x1="240" y1="318" x2="240" y2="326" stroke="#f3e3bf"/></g>
  <g transform="translate(125 336)">
    <path d="M0 -16 L3 -3 L16 0 L3 3 L0 16 L-3 3 L-16 0 L-3 -3 Z" fill="#d8a446" stroke="#05070b" stroke-width="1"/>
  </g>
  <path d="M30 340 C 50 330 70 344 92 336" fill="none" stroke="#f3e3bf" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M220 340 C 200 330 180 344 158 336" fill="none" stroke="#f3e3bf" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
  <path d="M154 330 l6 6 M160 330 l-6 6" stroke="#ec5f4a" stroke-width="2" stroke-linecap="round" transform="translate(68 4)"/>
  <g stroke="#d8a446" stroke-width="1.5">
    <line x1="32" y1="4" x2="32" y2="9"/><line x1="32" y1="55" x2="32" y2="60"/><line x1="4" y1="32" x2="9" y2="32"/><line x1="55" y1="32" x2="60" y2="32"/>
  </g>

  <!-- name banner -->
  <path d="M52 16 H224 L234 32 L224 48 H52 Z" fill="#131822" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M52 16 H224 L234 32 L224 48 H52 Z" fill="none" stroke="#d8a446" stroke-width="2" stroke-linejoin="round"/>
  <!-- type line plaque -->
  <path d="M70 194 H180 L190 204 L180 214 H70 L60 204 Z" fill="#131822" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M70 194 H180 L190 204 L180 214 H70 L60 204 Z" fill="none" stroke="#d8a446" stroke-width="2" stroke-linejoin="round"/>

  <!-- cost gem slot -->
  <circle cx="32" cy="32" r="23" fill="#05070b"/>
  <circle cx="32" cy="32" r="21" fill="url(#gem)" stroke="#d8a446" stroke-width="3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#f3e3bf" stroke-width="1" opacity="0.5"/>
  <path d="M20 22 A16 16 0 0 1 34 16" fill="none" stroke="#f3e3bf" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- rarity socket (fill with rarity glyph in HTML) -->
  <circle cx="125" cy="336" r="9" fill="#0b0e14" stroke="#d8a446" stroke-width="2"/>
</svg>
