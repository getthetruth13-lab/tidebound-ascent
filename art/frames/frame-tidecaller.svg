<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" role="img" aria-labelledby="t">
  <title id="t">Tidecaller card frame</title>
  <!-- Regions: gem c(32,32) r22 | banner x52-234 y16-48 | art window x20-230 y58-194 (transparent) | type x60-190 y194-214 | text x18-232 y220-326 | rarity c(125,336) r8 -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#155a80"/>
      <stop offset="0.55" stop-color="#0a2a3d"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#155a80"/>
      <stop offset="1" stop-color="#0a2a3d"/>
    </radialGradient>
  </defs>

  <!-- frame body with transparent art window -->
  <path d="M18 4 H232 A14 14 0 0 1 246 18 V332 A14 14 0 0 1 232 346 H18 A14 14 0 0 1 4 332 V18 A14 14 0 0 1 18 4 Z M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="url(#body)" fill-rule="evenodd" stroke="#05070b" stroke-width="2"/>
  <path d="M18 4 H232 A14 14 0 0 1 246 18 V332 A14 14 0 0 1 232 346 H18 A14 14 0 0 1 4 332 V18 A14 14 0 0 1 18 4 Z" fill="none" stroke="#2fb8c4" stroke-width="3" transform="translate(125 175) scale(0.985) translate(-125 -175)"/>
  <path d="M19 9 H231 A10 10 0 0 1 241 19 V331 A10 10 0 0 1 231 341 H19 A10 10 0 0 1 9 331 V19 A10 10 0 0 1 19 9 Z" fill="none" stroke="#a6f2e8" stroke-width="1" opacity="0.35"/>
  <!-- art window rim -->
  <path d="M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="none" stroke="#05070b" stroke-width="4"/>
  <path d="M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="none" stroke="#2fb8c4" stroke-width="2"/>

  <!-- text box (dark panel, keep clear of decoration) -->
  <rect x="18" y="220" width="214" height="106" rx="8" fill="#0b0e14" fill-opacity="0.92" stroke="#36405a" stroke-width="1.5"/>
  
  <!-- motif: tide scallops on side bands, foam curls at corners, waves along the bottom -->
  <g fill="none" stroke="#2fb8c4" stroke-width="1.5" stroke-linecap="round" opacity="0.9"><path d="M7 70 q5 -5 10 0" /><path d="M7 84 q5 -5 10 0" /><path d="M7 98 q5 -5 10 0" /><path d="M7 112 q5 -5 10 0" /><path d="M7 126 q5 -5 10 0" /><path d="M7 140 q5 -5 10 0" /><path d="M7 154 q5 -5 10 0" /><path d="M7 168 q5 -5 10 0" /><path d="M7 182 q5 -5 10 0" /><path d="M233 70 q5 -5 10 0" /><path d="M233 84 q5 -5 10 0" /><path d="M233 98 q5 -5 10 0" /><path d="M233 112 q5 -5 10 0" /><path d="M233 126 q5 -5 10 0" /><path d="M233 140 q5 -5 10 0" /><path d="M233 154 q5 -5 10 0" /><path d="M233 168 q5 -5 10 0" /><path d="M233 182 q5 -5 10 0" /></g>
  <g fill="none" stroke="#a6f2e8" stroke-width="2" stroke-linecap="round">
    <path d="M14 340 q8 -10 16 -2 q8 -10 16 -2 q8 -10 16 -2 q8 -10 16 -2 q8 -10 16 -2 q6 -7 10 -2"/>
    <path d="M236 340 q-8 -10 -16 -2 q-8 -10 -16 -2 q-8 -10 -16 -2 q-8 -10 -16 -2 q-8 -10 -16 -2 q-6 -7 -10 -2"/>
  </g>
  <path d="M12 300 c10 0 14 10 8 16 c-5 5 -12 1 -10 -5 c1 -3 5 -3 6 -1" fill="none" stroke="#a6f2e8" stroke-width="2" stroke-linecap="round"/>

  <!-- name banner -->
  <path d="M52 16 H224 L234 32 L224 48 H52 Z" fill="#131822" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M52 16 H224 L234 32 L224 48 H52 Z" fill="none" stroke="#2fb8c4" stroke-width="2" stroke-linejoin="round"/>
  <!-- type line plaque -->
  <path d="M70 194 H180 L190 204 L180 214 H70 L60 204 Z" fill="#131822" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M70 194 H180 L190 204 L180 214 H70 L60 204 Z" fill="none" stroke="#2fb8c4" stroke-width="2" stroke-linejoin="round"/>

  <!-- cost gem slot -->
  <circle cx="32" cy="32" r="23" fill="#05070b"/>
  <circle cx="32" cy="32" r="21" fill="url(#gem)" stroke="#2fb8c4" stroke-width="3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#a6f2e8" stroke-width="1" opacity="0.5"/>
  <path d="M20 22 A16 16 0 0 1 34 16" fill="none" stroke="#a6f2e8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- rarity socket (fill with rarity glyph in HTML) -->
  <circle cx="125" cy="336" r="9" fill="#0b0e14" stroke="#2fb8c4" stroke-width="2"/>
</svg>
