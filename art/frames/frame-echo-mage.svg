<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" width="250" height="350" role="img" aria-labelledby="t">
  <title id="t">Echo Mage card frame</title>
  <!-- Regions: gem c(32,32) r22 | banner x52-234 y16-48 | art window x20-230 y58-194 (transparent) | type x60-190 y194-214 | text x18-232 y220-326 | rarity c(125,336) r8 -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4b2c91"/>
      <stop offset="0.55" stop-color="#1d1238"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#4b2c91"/>
      <stop offset="1" stop-color="#1d1238"/>
    </radialGradient>
  </defs>

  <!-- frame body with transparent art window -->
  <path d="M18 4 H232 A14 14 0 0 1 246 18 V332 A14 14 0 0 1 232 346 H18 A14 14 0 0 1 4 332 V18 A14 14 0 0 1 18 4 Z M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="url(#body)" fill-rule="evenodd" stroke="#05070b" stroke-width="2"/>
  <path d="M18 4 H232 A14 14 0 0 1 246 18 V332 A14 14 0 0 1 232 346 H18 A14 14 0 0 1 4 332 V18 A14 14 0 0 1 18 4 Z" fill="none" stroke="#a07bff" stroke-width="3" transform="translate(125 175) scale(0.985) translate(-125 -175)"/>
  <path d="M19 9 H231 A10 10 0 0 1 241 19 V331 A10 10 0 0 1 231 341 H19 A10 10 0 0 1 9 331 V19 A10 10 0 0 1 19 9 Z" fill="none" stroke="#f0b8ff" stroke-width="1" opacity="0.35"/>
  <!-- art window rim -->
  <path d="M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="none" stroke="#05070b" stroke-width="4"/>
  <path d="M26 58 H224 A6 6 0 0 1 230 64 V188 A6 6 0 0 1 224 194 H26 A6 6 0 0 1 20 188 V64 A6 6 0 0 1 26 58 Z" fill="none" stroke="#a07bff" stroke-width="2"/>

