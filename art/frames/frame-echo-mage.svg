    <path d="M100 336 A25 25 0 0 1 150 336" stroke-width="2" opacity="0.9"/>
    <path d="M90 340 A35 35 0 0 1 160 340" stroke-width="1.5" opacity="0.55"/>
  </g>
  <g stroke="#f0b8ff" stroke-width="2" stroke-linecap="round" opacity="0.85"><line x1="10.0" y1="68" x2="14.0" y2="68"/><line x1="8.7" y1="75" x2="15.3" y2="75"/><line x1="6.7" y1="82" x2="17.3" y2="82"/><line x1="8.7" y1="89" x2="15.3" y2="89"/><line x1="10.0" y1="96" x2="14.0" y2="96"/><line x1="8.0" y1="103" x2="16.0" y2="103"/><line x1="6.0" y1="110" x2="18.0" y2="110"/><line x1="8.0" y1="117" x2="16.0" y2="117"/><line x1="10.0" y1="124" x2="14.0" y2="124"/><line x1="8.7" y1="131" x2="15.3" y2="131"/><line x1="6.7" y1="138" x2="17.3" y2="138"/><line x1="8.7" y1="145" x2="15.3" y2="145"/><line x1="10.0" y1="152" x2="14.0" y2="152"/><line x1="8.0" y1="159" x2="16.0" y2="159"/><line x1="6.0" y1="166" x2="18.0" y2="166"/><line x1="8.0" y1="173" x2="16.0" y2="173"/><line x1="10.0" y1="180" x2="14.0" y2="180"/><line x1="236.0" y1="68" x2="240.0" y2="68"/><line x1="234.7" y1="75" x2="241.3" y2="75"/><line x1="232.7" y1="82" x2="243.3" y2="82"/><line x1="234.7" y1="89" x2="241.3" y2="89"/><line x1="236.0" y1="96" x2="240.0" y2="96"/><line x1="234.0" y1="103" x2="242.0" y2="103"/><line x1="232.0" y1="110" x2="244.0" y2="110"/><line x1="234.0" y1="117" x2="242.0" y2="117"/><line x1="236.0" y1="124" x2="240.0" y2="124"/><line x1="234.7" y1="131" x2="241.3" y2="131"/><line x1="232.7" y1="138" x2="243.3" y2="138"/><line x1="234.7" y1="145" x2="241.3" y2="145"/><line x1="236.0" y1="152" x2="240.0" y2="152"/><line x1="234.0" y1="159" x2="242.0" y2="159"/><line x1="232.0" y1="166" x2="244.0" y2="166"/><line x1="234.0" y1="173" x2="242.0" y2="173"/><line x1="236.0" y1="180" x2="240.0" y2="180"/></g>
  <g fill="none" stroke="#f0b8ff" stroke-width="1.5">
    <circle cx="238" cy="338" r="4"/><circle cx="238" cy="338" r="8" opacity="0.5"/>
    <circle cx="12" cy="338" r="4"/><circle cx="12" cy="338" r="8" opacity="0.5"/>
