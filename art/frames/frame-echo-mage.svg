  <!-- name banner -->
  <path d="M52 16 H224 L234 32 L224 48 H52 Z" fill="#131822" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M52 16 H224 L234 32 L224 48 H52 Z" fill="none" stroke="#a07bff" stroke-width="2" stroke-linejoin="round"/>
  <!-- type line plaque -->
  <path d="M70 194 H180 L190 204 L180 214 H70 L60 204 Z" fill="#131822" stroke="#05070b" stroke-width="4" stroke-linejoin="round"/>
  <path d="M70 194 H180 L190 204 L180 214 H70 L60 204 Z" fill="none" stroke="#a07bff" stroke-width="2" stroke-linejoin="round"/>

  <!-- cost gem slot -->
  <circle cx="32" cy="32" r="23" fill="#05070b"/>
  <circle cx="32" cy="32" r="21" fill="url(#gem)" stroke="#a07bff" stroke-width="3"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#f0b8ff" stroke-width="1" opacity="0.5"/>
  <path d="M20 22 A16 16 0 0 1 34 16" fill="none" stroke="#f0b8ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

